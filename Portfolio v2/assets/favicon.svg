<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00c6ce"/>
      <stop offset="55%" stop-color="#0071e3"/>
      <stop offset="100%" stop-color="#0a3d91"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#bg)"/>
  <rect x="4" y="4" width="56" height="56" rx="16" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="1.5"/>
  <g filter="url(#glow)">
    <text x="50%" y="58%" text-anchor="middle" dominant-baseline="middle"
          font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700"
          fill="#ffffff" letter-spacing="-1">PB</text>
  </g>
  <circle cx="50" cy="46" r="4" fill="#ffb454"/>
</svg>
